# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-auth-sigv4"
version = "1.6.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The sigv4 auth style, served in both the operator's own credential and the caller's, as one auth-kind plugin on the auth kind's memory ABI."

# MOVED from busbar (crates/busbar-auth-sigv4 at busbar bb0c7f71d4, history imported;
# BUSBAR-1.6.0.md §9: every plugin lives in its own repo). The source is busbar's verbatim.

[lib]
# rlib only: the LINKED door (`busbar_auth_sigv4::door`, the `DoorFn` a compiled-in row holds) and the
# tests. The DROPPED door is the sibling `busbar-auth-sigv4-plugin` cdylib, the same door behind the
# one exported symbol.
crate-type = ["rlib"]

[features]
# DECLARED SO THE SOURCE COMPILES VERBATIM (src/lib.rs gates its `export_door!` on it). Nothing in
# this repo enables it: the dropped-in artifact is the sibling `busbar-auth-sigv4-plugin` cdylib, which
# exports this crate's door unconditionally. Enabling it here as well would export the one
# `busbar_plugin_door` symbol twice.
dropped-in = []

# DEPENDENCY POLICY. A plugin's closure is `busbar-contract` plus the third-party crates it needs to
# do its job (owner ruling 2026-09-28, PLUGIN LIBRARIES): the SigV4 HMAC chain (`hmac`, `sha2`,
# `hex`), and zeroisation of derived key material (`zeroize`). No kernel crate, no plane, no sibling
# auth-kind plugin.
# Every version is the workspace table's (busbar's at the pin).
[dependencies]
busbar-contract = { workspace = true }
hex = { workspace = true }
ring = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
zeroize = { workspace = true }
