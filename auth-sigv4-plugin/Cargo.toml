# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-auth-sigv4-plugin"
version = "1.6.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "First-party signed kind:auth plugin cdylib: the sigv4 auth module, packaged as a droppable busbar plugin. Drop the signed tarball into plugins/."

[lib]
# cdylib: the DROPPED-IN door (a signed tarball in `plugins/`), exporting `busbar_plugin_door`.
# rlib: what `cargo test` links, and what makes `cargo test` emit the cdylib the conformance test
# loads (a cdylib-only package builds a trivial test harness and never produces the library).
crate-type = ["cdylib", "rlib"]

[dependencies]
busbar-auth-sigv4 = { path = "../auth-sigv4" }
busbar-contract = { workspace = true }

[dev-dependencies]
# The existing dev-only retirement barrier proves ticket cleanup before measuring counts.
busbar-plugin-loader = { workspace = true, features = ["test-support"] }
# The binary-level both-ways suite (`tests/sigv4_both_ways.rs`, moved from busbar's root): it
# recomputes the SigV4 signatures it sends and receives (sha2, hex) and reads the admin API's JSON.
hex = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
busbar-contract = { workspace = true, features = ["test-seal"] }
